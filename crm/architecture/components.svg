<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="970" viewBox="0 0 1000 970" role="img" aria-labelledby="title desc">
<title id="title">Learn and Earn CRM: архитектура компонентов</title><desc id="desc">Три категории пользователей и три интерфейса работают через FastAPI и PostgreSQL. Рамка Docker Compose содержит пять компонентов. Caddy обеспечивает HTTPS-доступ отдельно от бизнес-логики.</desc>
