</text>
</g>
<g id="node-Attempt"><rect x="560" y="440" width="380" height="70" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.8"/>
<text x="750.0" y="479.3" text-anchor="middle" dominant-baseline="middle" font-size="24" font-weight="600">
