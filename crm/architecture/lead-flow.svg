<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190" role="img" aria-labelledby="title desc">
<title id="title">Learn and Earn CRM: тёплая заявка и холодный контакт</title><desc id="desc">Две отдельные воронки. Входящая заявка регистрируется Entry Bot, руководитель назначает менеджера вручную. Холодный контакт становится cold lead после содержательного ответа; простая попытка связи не создаёт лид.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#57606a"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1f2328} .line{fill:none;stroke:#57606a;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round} .stage{fill:#fff;stroke:#d1d9e0;stroke-width:1.5}</style>
<rect width="1000" height="1190" rx="14" fill="#f6f8fa"/>
<rect x="20" y="20" width="460" height="1140" rx="12" class="stage"/>
<text x="42" y="53.0" text-anchor="start" dominant-baseline="middle" font-size="22" font-weight="600">
<tspan x="42" dy="0.0">A · Тёплая заявка</tspan>
</text>
<rect x="520" y="20" width="460" height="1140" rx="12" class="stage"/>
<text x="542" y="53.0" text-anchor="start" dominant-baseline="middle" font-size="22" font-weight="600">
<tspan x="542" dy="0.0">B · Холодный контакт</tspan>
</text>
<path data-from="Client" data-to="Entry" d="M 250 160 V 200" class="line" marker-end="url(#arrow)"/>
<path data-from="Entry" data-to="Register" d="M 250 270 V 310" class="line" marker-end="url(#arrow)"/>
<path data-from="Register" data-to="WarmLead" d="M 250 400 V 440" class="line" marker-end="url(#arrow)"/>
<path data-from="WarmLead" data-to="Ack" d="M 250 510 V 540 H 145 V 580" class="line" marker-end="url(#arrow)"/>
<path data-from="WarmLead" data-to="Notify" d="M 250 510 V 540 H 355 V 580" class="line" marker-end="url(#arrow)"/>
<path data-from="Notify" data-to="Assign" d="M 355 670 V 720" class="line" marker-end="url(#arrow)"/>
<path data-from="Assign" data-to="Assigned" d="M 355 820 V 850 H 250 V 880" class="line" marker-end="url(#arrow)"/>
<path data-from="Assigned" data-to="Work" d="M 250 960 V 1000" class="line" marker-end="url(#arrow)"/>
<path data-from="Import" data-to="Base" d="M 750 160 V 200" class="line" marker-end="url(#arrow)"/>
<path data-from="Base" data-to="ColdAssign" d="M 750 270 V 310" class="line" marker-end="url(#arrow)"/>
<path data-from="ColdAssign" data-to="Attempt" d="M 750 400 V 440" class="line" marker-end="url(#arrow)"/>
<path data-from="Attempt" data-to="Response" d="M 750 510 V 580" class="line" marker-end="url(#arrow)"/>
<path data-from="Response" data-to="Remain" d="M 650 660 V 750" class="line" marker-end="url(#arrow)"/>
<rect x="623.8" y="685.5" width="52.5" height="35.0" rx="4" fill="#fff"/>
<text x="650" y="706.6" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="400">
<tspan x="650" dy="0.0">Нет</tspan>
</text>
<path data-from="Response" data-to="ColdLead" d="M 850 660 V 750" class="line" marker-end="url(#arrow)"/>
<rect x="829.5" y="685.5" width="41.0" height="35.0" rx="4" fill="#fff"/>
<text x="850" y="706.6" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="400">
<tspan x="850" dy="0.0">Да</tspan>
</text>
