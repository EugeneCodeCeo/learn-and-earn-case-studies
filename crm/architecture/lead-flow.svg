</text>
</g>
<g id="node-ColdAssign"><rect x="560" y="310" width="380" height="90" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.8"/>
<text x="750.0" y="344.4" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="600">
