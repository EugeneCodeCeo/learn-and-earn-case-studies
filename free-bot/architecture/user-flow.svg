<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" role="img" aria-labelledby="title desc">
<title id="title">Learn and Earn Free — пользовательский маршрут</title><desc id="desc">Три этапа: доступ и выбор одной ветки, цикл обучения с сохранением прогресса, завершение диагностики и отложенное уведомление.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#57606a"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1f2328} .line{fill:none;stroke:#57606a;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round} .stage{fill:#fff;stroke:#d1d9e0;stroke-width:1.5}</style>
<rect width="1000" height="950" rx="14" fill="#f6f8fa"/>
<rect x="20" y="20" width="960" height="220" rx="12" class="stage"/>
<text x="42" y="53.0" text-anchor="start" dominant-baseline="middle" font-size="22" font-weight="600">
<tspan x="42" dy="0.0">01 · Доступ и выбор ветки</tspan>
</text>
<rect x="20" y="260" width="960" height="380" rx="12" class="stage"/>
<text x="42" y="293.0" text-anchor="start" dominant-baseline="middle" font-size="22" font-weight="600">
<tspan x="42" dy="0.0">02 · Обучение · 2 модуля × 3 урока в каждой ветке</tspan>
</text>
<rect x="20" y="710" width="960" height="220" rx="12" class="stage"/>
<text x="42" y="743.0" text-anchor="start" dominant-baseline="middle" font-size="22" font-weight="600">
<tspan x="42" dy="0.0">03 · Завершение диагностики</tspan>
</text>
<path data-from="Start" data-to="Choice" d="M 280 145 H 380" class="line" marker-end="url(#arrow)"/>
