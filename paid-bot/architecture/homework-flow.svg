<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" role="img" aria-labelledby="title desc">
<title id="title">Learn and Earn Paid: обучение и проверка практики</title><desc id="desc">После первичной отправки учебный прогресс и кураторская проверка идут независимо. Доработка возвращает работу в pending и не открывает новый модуль. Условие завершения курса требует проверки.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#57606a"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1f2328} .line{fill:none;stroke:#57606a;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round} .stage{fill:#fff;stroke:#d1d9e0;stroke-width:1.5}</style>
