<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
<title id="title">Learn and Earn Paid: взаимодействие компонентов</title><desc id="desc">Ученик и кураторская группа обмениваются сообщениями с приложением через Telegram Bot API. Python и aiogram 3 используют FSM для текущего диалога и SQLite для данных, прогресса, работ и обращений.</desc>
