<path data-from="Bot" data-to="DB" d="M 410 475 V 585 H 700 V 650" class="line" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path data-from="Assets" data-to="Bot" d="M 210 650 V 475" class="line" marker-end="url(#arrow)"/>
